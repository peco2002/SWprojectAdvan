name: runright
description: RunRight - 러닝 입문자를 위한 신체 맞춤형 페이스 코칭 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── GPS / 위치
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # ── TTS
  flutter_tts: ^4.0.2

  # ── Firebase (팀원3·4 연동)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_database: ^11.1.0

  # ── 상태관리
  provider: ^6.1.2

  # ── 로컬 저장
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.6

  # ── 지도
  google_maps_flutter: ^2.9.0

  # ── ML 추론
  tflite_flutter: ^0.12.0

  # ── 헬스 커넥트
  health: ^11.0.0

  # ── 차트
  fl_chart: ^0.68.0

  # ── 파일 선택 (TCX 가져오기)
  file_picker: ^8.0.0

  # ── OSM 지도 (코스 추천)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── HTTP 클라이언트 (Nominatim, Overpass API)
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/norm_params.json
    - assets/vo2max_model.tflite
